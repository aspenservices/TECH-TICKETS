<!--
  ═══════════════════════════════════════════════════════════════════════════
  ASPEN SPAS — CUSTOMER INTAKE FORM                          v2.9.0 · Jul 2026
  ═══════════════════════════════════════════════════════════════════════════
  This page has NO Firebase SDK and NO service worker, on purpose.

  The estimate-signing link taught us the hard way: inside the Messages and
  WhatsApp webviews, setPersistence(LOCAL) needs IndexedDB, which those
  webviews block. signInAnonymously() then never establishes a session, and
  Firestore happily serves the document from its local cache — so the page
  LOOKS fine and the failure only surfaces when a write is denied.

  So the customer's browser talks to exactly two HTTP endpoints. The Cloud
  Functions write with the Admin SDK. No auth, no rules, no IndexedDB, no
  cached-stale-data class of bug. It works the same in Safari, Chrome,
  private mode, the Messages webview and Android.

  Deploy: repo root, next to index.html, on GitHub Pages.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>

<body>
<div class="stage"><div class="sheet">
  <div class="hdr">
    <div class="wm">ASPEN <span>SPAS</span></div>
    <div class="tl">Service Request</div>
  </div>
  <div id="root">
    <div class="center"><div class="spin"></div><p>Loading your form…</p></div>
  </div>
</div></div>

<script>
/* ── Endpoints ───────────────────────────────────────────────────────────── */
var FN="https://us-central1-tech-tickets-a9485.cloudfunctions.net/";
var MAX_PHOTOS=12, MAX_EDGE=1600, JPEG_Q=0.72;

/* ── Estado ──────────────────────────────────────────────────────────────── */
var TOKEN="", info=null, sending=false, err="";
/* v3.0 (16 ago 2026) — DIRECCION B "ficha de servicio", con las notas del dueno.
   symptoms  = sintomas de un toque; escriben en el campo y ADEMAS viajan sueltos,
               para que Service Log reciba dato estructurado y no un parrafo.
   brandKind = "aspen" | "other"  (su nota: "let them click a button")
   notes     = sus cuatro ejemplos del "what else" como chips. */
var d={problem:"",since:"",brand:"",model:"",serial:"",errorCode:"",powerOn:null,
       symptoms:[],brandKind:"",notes:[],
       extra:"",contactPref:"",bestTime:"",name:"",phone:"",addr:"",photos:[],
       /* v2.19.0 — invitacion de videollamada */
       availability:"", facetime:null, googleAccount:"", callPref:"video"};
/* Si el link es una invitacion de videollamada, intakeGet devuelve kind:"coaching".
   OJO: eso exige que la Cloud Function incluya `kind` en su respuesta; hoy solo
   manda {ok,status,expired,customer,phone,address}. Sin esa linea este archivo
   pinta el formulario de servicio de siempre, que es un degradado seguro. */
function isCoachingInvite(){ return !!(info && info.kind==="coaching"); }

/* v3.0 — MODELOS REALES, tomados de aspenspas.com/spas-overview y /swim-spas-overview
   el 16 ago 2026. Antes esto era un campo de texto libre y los modelos que se
   barajaron (Ellis, NorthStar suelto) salian de codigos de cover, no del catalogo.
   El acabado (ES/AS/GS) NO se le pregunta al cliente: la ficha del spa ya lo trae. */
var SERIES=[
 {s:"8' spas",  m:[["Pinnacle","6 adults · lounger"],["Arcadia","7 adults"],["Alpine","7 adults · lounger"]]},
 {s:"7' spas",  m:[["Eldorado","5 adults · lounger"],["Monarch","5 adults"]]},
 {s:"Small spas",m:[["Quattro","4 adults · lounger"],["Colorado","4 adults"],["Pioneer","5 adults"],["Northstar","5 adults"]]},
 {s:"Swim spas",m:[["S.W.I.M. 16'","Swim lane"],["S.W.I.M. 13'","Swim lane"],["PARTY 16'","Up to 9"],["PARTY 13'","Seating + swim"]]}
];
/* Sintomas: el texto que se inserta es el que leera el tecnico. */
var SYMPTOMS=[
 ["\uD83C\uDF21\uFE0F","Not heating","The water is not heating up. "],
 ["\uD83D\uDCA7","Leaking","There is a leak. "],
 ["\uD83D\uDD24","Error code","The display is showing an error code. "],
 ["\uD83C\uDF00","Weak jets","The jets are weak or not working. "],
 ["\uD83D\uDD0A","Strange noise","It is making a noise it did not make before. "],
 ["\uD83E\uDEE7","Cloudy water","The water looks cloudy or off. "],
 ["\u26A1","No power","It has no power at all. "]
];
var NOTE_CHIPS=["Recent repair","Electrical surge","Recent water change","Power outage","Someone else worked on it"];

function toggleSym(i){
  var s=SYMPTOMS[i],k=s[1],at=d.symptoms.indexOf(k);
  if(at>=0){ d.symptoms.splice(at,1); d.problem=d.problem.replace(s[2],""); }
  else{ d.symptoms.push(k); d.problem=(d.problem?d.problem.replace(/\s*$/,"")+" ":"")+s[2]; }
  render();
  try{var el=$("problem");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}catch(e){}
}
function toggleNote(n){ var at=d.notes.indexOf(n); if(at>=0)d.notes.splice(at,1); else d.notes.push(n); render(); }
function pickBrand(k){
  d.brandKind=k;
  if(k==="aspen"){ d.brand="Aspen" } else { if(d.brand==="Aspen")d.brand=""; d.model="" }
  render();
}
function pickModel(m){ d.model=(d.model===m?"":m); render(); }

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function firstName(n){
  var s=String(n||"").trim();
  if(s.indexOf(",")>-1)s=s.split(",")[1]||s.split(",")[0];
  s=s.replace(/&.*$/,"").trim();
  return s.split(/\s+/)[0]||"there";
}

/* ── Borrador local: SOLO TEXTO ───────────────────────────────────────────
   Nunca las fotos. Todas las apps de Aspen se sirven del mismo origen y
   comparten una sola cuota de ~5 MB, ya ocupada en ~3 MB. Guardar fotos aqui
   lanzaria QuotaExceededError y podria romper OTRA app (Warehouse, Delivery).
   ─────────────────────────────────────────────────────────────────────── */
function draftKey(){return "aspIntake_"+TOKEN}
function saveDraft(){
  try{
    var t={};["problem","since","brand","model","serial","errorCode","powerOn",
             "extra","contactPref","bestTime","name","phone","addr"]
      .forEach(function(k){if(d[k])t[k]=d[k]});
    var s=JSON.stringify(t);
    if(s.length<12000)localStorage.setItem(draftKey(),s);
  }catch(_e){/* cuota llena o modo privado: seguimos sin borrador */}
}
function loadDraft(){
  try{
    var s=localStorage.getItem(draftKey());if(!s)return;
    var t=JSON.parse(s);Object.keys(t).forEach(function(k){d[k]=t[k]});
  }catch(_e){}
}
function clearDraft(){try{localStorage.removeItem(draftKey())}catch(_e){}}

/* ── Red: POST con reintentos y espera creciente ─────────────────────────── */
function post(path,body,tries){
  tries=tries||3;
  return new Promise(function(resolve,reject){
    var n=0;
    (function go(){
      n++;
      var ctl=("AbortController" in window)?new AbortController():null;
      var timer=setTimeout(function(){try{ctl&&ctl.abort()}catch(_e){}},45000);
      fetch(FN+path,{method:"POST",headers:{"Content-Type":"application/json"},
                     body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(timer);return r.json().then(function(j){
        if(!r.ok||!j||j.ok!==true)throw new Error((j&&j.error)||("HTTP "+r.status));
        return j;})})
      .then(resolve)
      .catch(function(e){
        clearTimeout(timer);
        if(n<tries)setTimeout(go,220*Math.pow(2,n-1));
        else reject(e);
      });
    })();
  });
}

/* ── Arranque ────────────────────────────────────────────────────────────── */
(function init(){
  try{TOKEN=(new URLSearchParams(location.search)).get("t")||""}catch(_e){TOKEN=""}
  if(!/^[0-9a-f]{16,64}$/.test(TOKEN)){
    return fail("This link isn’t valid",
      "Please use the exact link we sent you, or call us and we’ll send a new one.");
  }
  fetch(FN+"intakeGet?t="+encodeURIComponent(TOKEN))
    .then(function(r){return r.json()})
    .then(function(j){
      if(!j||j.ok!==true)throw new Error((j&&j.error)||"not_found");
      info=j;
      if(j.status==="received"||j.status==="triaged")
        return done("We already have this one",
          "Thanks — your information came through. Someone from our service team will be in touch.");
      if(j.expired)
        return fail("This link has expired",
          "Give us a call and we’ll send you a fresh one right away.");
      d.name=j.customer||"";d.phone=j.phone||"";d.addr=j.address||"";
      loadDraft();render();
    })
    .catch(function(e){
      console.warn("[intake]",e);
      fail("We couldn’t open your form",
        "Check your signal and reload the page. If it keeps happening, call us and we’ll take it over the phone.");
    });
})();

/* ── Pantallas simples ───────────────────────────────────────────────────── */
function fail(title,msg){
  $("root").innerHTML='<div class="center"><div class="mk bad">!</div><h2>'+esc(title)+'</h2>'
    +'<p>'+esc(msg)+'</p><div class="ph">Aspen Spas Service<br>'
    +'<a href="tel:3147765050">314-776-5050</a></div></div>';
}
function done(title,msg){
  $("root").innerHTML='<div class="center"><div class="mk">\u2713</div><h2>'+esc(title)+'</h2>'
    +'<p>'+esc(msg)+'</p><div class="ph">Aspen Spas Service<br>'
    +'<a href="tel:3147765050">314-776-5050</a></div></div>';
}

/* ── Formulario ──────────────────────────────────────────────────────────── */
function set(k,v){d[k]=v;saveDraft()}
function pick(k,v){d[k]=v;saveDraft();render()}
function setPower(v){d.powerOn=v;saveDraft();render()}
function rmPhoto(i){d.photos.splice(i,1);render()}

/* ── v2.19.0 · el formulario de la videollamada ────────────────────────────
   Tres preguntas y nada mas. La hora la PROPONE EL CLIENTE (decision de
   Alberto): no le ofrecemos horarios, el escribe cuando puede.
   NOTA HONESTA: ni FaceTime ni Google Meet dejan generar el link del encuentro
   desde una pagina. Aqui solo se recoge COMO y CUANDO; el enlace del encuentro
   lo crea Aspen a mano al momento de llamar. */
function renderCoachingInvite(){
  /* Mismo esqueleto de pasos que el formulario de servicio, y REUSA su
     maquinaria de fotos (addPhotos/rmPhoto/MAX_PHOTOS): se comprimen en el
     telefono igual que alli, asi que llegan aunque la senal sea mala. */
  var listo = d.problem.trim().length>9 && d.availability.trim().length>2
            && d.facetime!==null
            && (d.callPref==="phone" || d.facetime===true || d.googleAccount.trim().length>3);
  var photos=d.photos.length
    ? '<div class="pgrid">'+d.photos.map(function(p,i){
        return '<div class="pitem'+(p.up?" up":"")+'"><img src="'+p.url+'" alt="">'
          +'<button class="x" type="button" onclick="rmPhoto('+i+')" aria-label="Remove photo">\u00d7</button>'
          +'<div class="sz">'+p.origKB+' KB \u2192 '+p.sizeKB+' KB</div></div>'
      }).join("")+'</div>'
      +'<p class="h" style="margin-top:10px">'+d.photos.length+' of '+MAX_PHOTOS+'. '
      +'We shrink them right here on your phone so they send fast even on a weak signal.</p>'
    : "";

  $("root").innerHTML=
   '<div class="body">'
  +'<h1>Let us look at it together, '+esc(firstName(info.customer))+'</h1>'
  +'<p class="intro">We would like to set up a call about your spa. Tell us what it is doing, '
  +'send a few photos, and pick a time \u2014 about two minutes.</p>'

  +'<div class="step"><div class="num">The problem</div><h2>What is it doing?</h2>'
  +'<p class="h">Write it however you\u2019d say it out loud. There\u2019s no wrong way.</p>'
  +'<textarea class="inp" rows="4" placeholder="e.g. the jets barely run and the panel shows FLO" '
  +'oninput="setNote(this.value)">'+esc(d.problem)+'</textarea></div>'

  +'<div class="step"><div class="num">Photos</div><h2>Show us what you see</h2>'
  +'<p class="h">The control panel, the equipment bay, anything leaking or burnt. '
  +'On the call we will know exactly where to point you.</p>'
  +'<label class="drop" for="pk"><div class="big">\uD83D\uDCF7</div>'
  +'<div class="t">Add photos</div><div class="s">Take a picture or choose from your phone</div></label>'
  +'<input type="file" id="pk" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files)">'

  +'<div class="step"><div class="num">When</div><h2>When are you free?</h2>'

  +'<textarea class="inp" rows="3" placeholder="e.g. Thursday morning, or Friday after 4pm" '
  +'oninput="setAvail(this.value)">'+esc(d.availability)+'</textarea></div>'

  +'<div class="step"><div class="num">How</div><h2>Video or just a phone call?</h2>'
  +'<p class="h">On video we can see the spa with you, which usually solves it faster.</p>'
  +'<div class="opts">'

  +'<button type="button" class="opt'+(d.callPref==="phone"?" on":"")+'" onclick="setPref(\'phone\')">Just a phone call</button>'
  +'</div>'
  +(d.callPref==="video"

     +'<p class="h">It comes built in on iPhone and iPad. If you are not sure, pick the second one.</p>'
     +'<div class="opts">'

  +(sending?"Sending\u2026":"Send to Aspen Spas")+'</button>'
  +'</div>';
}

function setAvail(v){d.availability=v;saveDraft()}
function setG(v){d.googleAccount=v;saveDraft()}
function setNote(v){d.problem=v;saveDraft()}
function setFT(v){d.facetime=v;saveDraft();renderCoachingInvite()}
function setPref(v){d.callPref=v;if(v==="phone")d.facetime=null;saveDraft();renderCoachingInvite()}

async function submitInvite(){
  if(sending)return;
  if(d.problem.trim().length<10){err="Tell us what the spa is doing \u2014 a sentence or two is enough.";return renderCoachingInvite()}
  if(d.availability.trim().length<3){err="Tell us when you are free.";return renderCoachingInvite()}
  if(d.callPref==="video"&&d.facetime===null){err="Let us know about FaceTime.";return renderCoachingInvite()}
  if(d.callPref==="video"&&d.facetime===false&&d.googleAccount.trim().length<4){
    err="We need your Google account to send a Meet link.";return renderCoachingInvite()}
  err="";sending=true;renderCoachingInvite();
  var steps=d.photos.length+1, at=0;
  function tick(msg){at++;var b=$("pbar"),m=$("pmsg");
    if(b)b.style.width=Math.round(at/steps*100)+"%";if(m)m.textContent=msg}
  var uploaded=[];
  try{
    /* una foto por peticion, igual que el formulario de servicio: en una
       senal floja un solo envio gigante se cae entero */
    for(var i=0;i<d.photos.length;i++){
      var p=d.photos[i];
      var res=await post("intakeSubmit",{t:TOKEN,kind:"photo",name:p.name,dataUrl:p.url});
      uploaded.push({url:res.url,path:res.path,name:p.name,sizeKB:p.sizeKB});
      tick("Sending photo "+(i+1)+" of "+d.photos.length+"\u2026");
    }
    await post("intakeSubmit",{t:TOKEN,kind:"final",photos:uploaded,reply:{
      problem:d.problem.trim(),
      availability:d.availability.trim(),
      callPref:d.callPref,
      facetime:d.callPref==="video"?d.facetime:null,
      googleAccount:(d.callPref==="video"&&d.facetime===false)?d.googleAccount.trim():""
    }});
    clearDraft();
    done("Thank you \u2014 we have it",
         "We will confirm the day and time and get back to you with the details for the call.");
  }catch(e){
    console.warn("[invite]",e);
    sending=false;err="That did not go through. Please try again.";renderCoachingInvite();
  }
}

/* v3.0 — cuantos de los cinco bloques ya tienen algo. Alimenta la barra del hero. */
function _progress(){
  var n=0;
  if((d.name||"").trim()&&(d.phone||"").trim())n++;
  if((d.problem||"").trim().length>=10)n++;
  if(d.photos.length)n++;
  if(d.brandKind)n++;
  if(d.notes.length||(d.extra||"").trim())n++;
  return n;
}

/* ── Fotos: se comprimen en el telefono antes de salir ───────────────────── */
function addPhotos(files){
  if(!files||!files.length)return;
  var room=MAX_PHOTOS-d.photos.length;
  if(room<=0){err="That\u2019s the most photos we can take. Remove one if you want to swap it.";render();return}
  var list=Array.prototype.slice.call(files,0,room);
  var pending=list.length;
  list.forEach(function(file){
    if(!/^image\//.test(file.type||"")){if(--pending===0)render();return}
    var origKB=Math.round(file.size/1024);
    var fr=new FileReader();
    fr.onload=function(e){
      var img=new Image();
      img.onload=function(){
        try{
          var w=img.width,h=img.height;
          if(w>MAX_EDGE||h>MAX_EDGE){var s=MAX_EDGE/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
          var c=document.createElement("canvas");c.width=w;c.height=h;
          var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          var url=c.toDataURL("image/jpeg",JPEG_Q);
          d.photos.push({url:url,name:file.name||"photo.jpg",origKB:origKB,
                         sizeKB:Math.round(url.length*0.75/1024)});
        }catch(_e){/* una foto rara no debe tumbar el formulario */}
        if(--pending===0)render();
      };
      img.onerror=function(){if(--pending===0)render()};
      img.src=e.target.result;
    };
    fr.onerror=function(){if(--pending===0)render()};
    fr.readAsDataURL(file);
  });
}

/* ── Envio: una foto por peticion, luego el formulario ───────────────────── */
async function submitForm(){
  if(sending)return;
  if(!d.problem||d.problem.trim().length<10){
    err="Please tell us what the spa is doing \u2014 a sentence or two is enough.";
    render();
    var el=$("problem");
    if(el){el.classList.add("bad");el.focus();
           try{el.scrollIntoView({behavior:"smooth",block:"center"})}catch(_e){}}
    return;
  }
  err="";sending=true;render();
  var steps=d.photos.length+1, at=0;
  function tick(msg){
    at++;var b=$("pbar"),m=$("pmsg");
    if(b)b.style.width=Math.round(at/steps*100)+"%";
    if(m)m.textContent=msg;
  }
  var uploaded=[];
  try{
    for(var i=0;i<d.photos.length;i++){
      var p=d.photos[i];
      var res=await post("intakeSubmit",{t:TOKEN,kind:"photo",name:p.name,dataUrl:p.url});
      uploaded.push({url:res.url,path:res.path,name:p.name,sizeKB:p.sizeKB});
      tick("Sending photo "+(i+1)+" of "+d.photos.length+"\u2026");
    }
    await post("intakeSubmit",{t:TOKEN,kind:"final",photos:uploaded,reply:{
      problem:d.problem,since:d.since,brand:d.brand,model:d.model,serial:d.serial,
      /* v3.0 — sueltos y estructurados, ademas de dentro del texto. */
      symptoms:d.symptoms,notes:d.notes,brandKind:d.brandKind,
      errorCode:d.errorCode,powerOn:d.powerOn,extra:d.extra,
      contactPref:d.contactPref,bestTime:d.bestTime,
      name:d.name,phone:d.phone,address:d.addr
    }});
    tick("Almost done\u2026");
    clearDraft();
    done("Got it, "+firstName(info.customer),
      "Your spa details are with our service team. Someone will call you back to go over next steps \u2014 "
      +"either a coaching call to walk you through it, or a technician visit.");
  }catch(e){
    console.warn("[intake submit]",e);
    sending=false;
    err="We couldn\u2019t send it just now \u2014 check your signal and press send again. "
      +"Nothing you typed was lost. If it keeps failing, call us at 314-776-5050.";
    render();
  }
}
